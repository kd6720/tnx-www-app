# Unknown routes → real 404 (soft-404 fix: no more 200-with-homepage).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# --- Security headers (all routes) ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://webforms.pipedrive.com https://cdn.pipedriveassets.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https:; frame-src 'self' https://webforms.pipedrive.com https://enhancedlines.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

# --- Long-lived caching for fingerprinted build assets ---
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Medium-lived caching for un-fingerprinted media (hero videos, posters, images) ---
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/partners/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/blog-images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/team/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
