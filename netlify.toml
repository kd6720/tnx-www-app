[build]
  command = "npm run build"
  publish = "dist"
  base = "/"

# --- SEO 301 redirects (server-side, before the SPA fallback) ---
# Old service page consolidated into Voice Solutions.
[[redirects]]
  from = "/ip-pbx"
  to = "/voice-solutions"
  status = 301
  force = true

# Ensure blog detail URLs resolve to their directory index pages before SPA fallback.
[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug/"
  status = 301
  force = false

# SPA fallback — every other path serves the React app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Security headers (all routes) ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# --- Long-lived caching for fingerprinted build assets ---
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
