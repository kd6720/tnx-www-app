[build]
  command = "npm run build"
  publish = "dist"
  base = "/"

# --- SEO 301 redirects (server-side, before the SPA fallback) ---
# Old service page consolidated into Voice Solutions.
[[redirects]]
  from = "/ip-pbx"
  to = "/voice-solutions"
  status = 301
  force = true

# Fleet management consolidated into AI Consulting (route had no dedicated page;
# prerendered shell was a duplicate of the homepage with mismatched meta).
[[redirects]]
  from = "/fleet-management"
  to = "/ai-consulting"
  status = 301
  force = true

# Ensure blog detail URLs resolve to their generated static HTML before SPA fallback.
# force = true so /blog/:slug is served DIRECTLY (200, no 301 to the trailing-slash
# form) — matching the canonical/og:url tags, which Facebook/LinkedIn scrapers key on.
[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/blog/:slug/"
  to = "/blog/:slug/index.html"
  status = 200
  force = true

# Known SPA routes → index.html (200) so deep-linking and refresh work.
# Unknown paths fall through to /404.html (404) below instead of a soft-404.
#
# IMPORTANT: every route registered in src/App.tsx MUST have an explicit
# redirect here (or a matching static file), or it 404s in production after
# this soft-404 fix. Sprint 2/3 add /platforms/partner-hub, /platforms/crm,
# /partners, and /ai — add them to this list as part of those sprints.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
