<!doctype html>
<html lang="en" data-seo-ready="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | TrustedNetworx</title>
    <meta name="description" content="The page you're looking for doesn't exist or may have moved." />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0a1428;
        color: #e2e8f0;
        padding: 24px;
      }
      .card { max-width: 480px; text-align: center; }
      .code {
        font-size: 6rem;
        font-weight: 800;
        line-height: 1;
        color: #14b8a6;
      }
      h1 { font-size: 1.75rem; font-weight: 700; margin-top: 16px; color: #f8fafc; }
      p { margin-top: 16px; color: #94a3b8; line-height: 1.6; }
      .links { margin-top: 32px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-flex;
        align-items: center;
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }
      a.primary { background: #0d9488; color: #fff; }
      a.primary:hover { background: #0f766e; }
      a.ghost { border: 1px solid rgba(255,255,255,0.15); color: #cbd5e1; }
      a.ghost:hover { background: rgba(255,255,255,0.06); }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>
        The page you're looking for doesn't exist or may have moved. Let's get you back on track.
      </p>
      <div class="links">
        <a class="primary" href="/">Back to Home</a>
        <a class="ghost" href="/contact">Contact Us</a>
        <a class="ghost" href="/blog">Blog</a>
      </div>
    </div>
  </body>
</html>
